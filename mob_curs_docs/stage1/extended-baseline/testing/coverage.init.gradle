import org.gradle.testing.jacoco.tasks.JacocoReport
import org.gradle.api.tasks.testing.Test

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.pluginManager.apply('jacoco')
    app.jacoco.toolVersion = '0.8.14'
    def unit = app.tasks.named('testDebugUnitTest', Test)
    unit.configure {
        // Execute tests every invocation, without forcing compilation to rerun.
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
        ignoreFailures = true
        jacoco {
            destinationFile = app.layout.buildDirectory.file('jacoco/baseline.exec').get().asFile
            includeNoLocationClasses = false
        }
    }
    app.tasks.register('baselineCoverage', JacocoReport) {
        dependsOn unit
        executionData app.layout.buildDirectory.file('jacoco/baseline.exec')
        classDirectories.from(app.fileTree('build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes') {
            include '**/*.class'
        })
        sourceDirectories.from(app.file('src/main/kotlin'))
        reports {
            xml.required = true
            xml.outputLocation = app.layout.buildDirectory.file('reports/jacoco/baseline.xml')
            html.required = false
            csv.required = true
            csv.outputLocation = app.layout.buildDirectory.file('reports/jacoco/baseline.csv')
        }
    }
}
